<style>
:root{font:14px/1.6 system-ui,sans-serif;--bg:#f5f7fa;--surface:#fff;--line:#e4e7ec;--text:#1d2939;--muted:#667085;--accent:#254e70;--on:#fff;--selected:#eaf1f7;color:var(--text);background:var(--bg)}*{box-sizing:border-box}body{margin:0}.dark{--bg:#151c25;--surface:#202b38;--line:#3d4b5d;--text:#edf1f7;--muted:#b0bdcc;--accent:#a5cbe8;--on:#122a3c;--selected:#2b4156;color-scheme:dark}.sidebar{position:fixed;inset:0 auto 0 0;width:208px;padding:20px 12px;background:var(--surface);border-right:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;padding:0 10px;margin-bottom:24px}.mark{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--on);display:grid;place-items:center;font-size:22px}.brand small{display:block;font-size:12px;color:var(--muted)}.menu{display:grid;gap:8px}.menu span{padding:8px 12px}.menu .group{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}.menu .sub{padding-left:22px}.menu .active{background:var(--selected);border-radius:6px;color:var(--accent);font-weight:600}.sidebar footer{margin:28px 12px;font-size:12px;color:var(--muted)}.topbar{height:64px;margin-left:208px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--line);font-weight:600}.topbar .tools{display:flex;align-items:center;gap:20px;font-size:12px}.tools span{font-weight:400;color:var(--muted)}.themes{border:1px solid var(--line);border-radius:4px;overflow:hidden}.themes b{padding:4px 10px}.themes b:last-child{color:var(--on);background:var(--accent)}.main{margin-left:208px;padding:32px;display:grid;gap:24px;min-width:0}.heading{display:flex;align-items:center;justify-content:space-between;gap:20px}.heading h1{margin:0;font-size:26px;line-height:36px}.heading p{font-size:13px;color:var(--muted);margin:6px 0 0}.heading .copy{flex:1;min-width:0}button,.primary-link{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--text);font:14px/22px system-ui;min-height:40px;padding:8px 16px;white-space:nowrap}.primary{background:var(--accent);border-color:var(--accent);color:var(--on)}button:disabled{opacity:.6}.panel{min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}.filters{padding:24px;display:flex;align-items:end;flex-wrap:wrap;gap:16px}.filters label{display:grid;gap:6px;color:var(--muted);font-size:13px;min-width:140px}input,select{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;font:14px/22px system-ui;min-height:40px;padding:8px 12px}.filters input{width:220px}.table-scroll{overflow-x:auto;border-block:1px solid var(--line)}table{width:100%;min-width:800px;border-collapse:collapse}th,td{padding:12px 24px;text-align:left;border-bottom:1px solid var(--line);height:64px;line-height:20px;overflow-wrap:anywhere}thead th{height:48px;padding-block:14px;font-size:12px;font-weight:500;color:var(--muted);background:var(--bg);white-space:nowrap}tbody tr:last-child td{border-bottom:0}td button{border-color:transparent;color:var(--accent);background:transparent;min-height:32px;padding:4px 0;font-size:13px}td p{margin:6px 0 0;font-size:13px;line-height:20px;color:var(--muted)}.pagination{display:flex;justify-content:end;align-items:center;gap:12px;padding:18px 24px;margin:0}.pagination label{display:flex;align-items:center;gap:8px}.pagination select{padding:6.4px;font-size:14px}.feedback{display:inline-block;margin-right:12px;white-space:nowrap}.padded{padding:24px}.padded>h2{margin:0 0 20px;font-size:16px;line-height:24px}.columns{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;align-items:start}.kind-table{border:1px solid var(--line);border-radius:8px;overflow:hidden}.kind-table table{min-width:0}.kind-table th,.kind-table td{padding-inline:12px}.kind-table td:first-child{width:45%}.kind-table .active{background:var(--selected);color:var(--accent)}.word-navigation{display:flex;gap:8px;margin:16px 0 -8px;padding:0 0 0;line-height:27.2px}.word-navigation span{padding:8px 12px;border-bottom:2px solid transparent;font-size:16px;color:var(--accent)}.word-navigation .active{border-color:var(--accent);font-weight:600}.word-search{display:grid;gap:6px;color:var(--muted);font-size:13px;margin:14px 0 0;max-width:220px}.word-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0;align-items:center}.word-toolbar .spacer{margin-left:auto}.word-table{border:1px solid var(--line);border-radius:8px;overflow:auto}.word-table caption{padding:8px 12px;font-size:13px;color:var(--muted);text-align:left;line-height:20.8px}.word-table td:first-child{width:25%}.word-table td:nth-child(2){width:33%}.switch{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}.switch i{width:34px;height:20px;border-radius:20px;background:var(--accent);position:relative}.switch i:after{content:'';position:absolute;right:3px;top:3px;width:14px;height:14px;border-radius:50%;background:white}.actions{display:flex;gap:8px}.word-pagination{padding:0;margin-top:20px}.record{margin:14px 0}.page-footer{margin:12px 0 0 208px;padding:32px;font-size:12px;text-align:center;color:var(--muted)}.drawer-backdrop{position:fixed;inset:0;background:#0006}.drawer{position:fixed;inset:0 0 0 auto;width:min(680px,100vw);height:100vh;display:flex;flex-direction:column;background:var(--surface)}.drawer header{padding:24px 24px 20px;border-bottom:1px solid var(--line)}.drawer h2{margin:0;font-size:20px;line-height:28px}.drawer header p{margin:6px 0 0;font-size:13px;color:var(--muted)}.drawer-body{padding:24px;overflow:auto;flex:1}.drawer-body label{display:grid;gap:6px;margin-bottom:20px;font-size:13px;color:var(--muted)}.drawer footer{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:end;gap:12px}
@media(max-width:760px){.sidebar{display:none}.topbar{margin:0;height:102px;padding:16px;align-items:start;flex-direction:column;gap:12px}.main{margin:0;padding:24px 12px}.heading{flex-direction:column;align-items:stretch;gap:16px}.heading>button{align-self:end}.filters label{flex:1 1 160px}.filters input{width:100%}.padded{padding:20px}.columns{grid-template-columns:minmax(0,1fr)}.page-footer{margin:0}.word-navigation{flex-wrap:wrap}.drawer-body{padding:20px}.word-toolbar .spacer{margin-left:0}}
</style>
<script id="same-data" type="application/json">{"/resources": {"title": "资料管理", "description": "管理分类、简介、文件与下载链接；草稿保存后仍需显式上架。", "tableData": [["从容开始的一周：阅读、散步与时间安排合成资料\n\n这是一份本机设计验证资料。 先留一段安静的时间，再安排想做的事情；阅读、散步与朋友交谈，都可以慢慢进行。 长文本换行验证：KeepReadingWithoutHurryKeepReadingWithoutHurryKeepReading", "样板资料 · 阅读与生活 · 已上架", "有用 0链接失效 0年代久远 0不全 0", "2026年11月16日 17:42", "查看详情"]]}, "/resource-categories": {"title": "资料分类", "description": "维护分类名称、排序与启用状态；排序数字越小越靠前。", "tableData": [["样板资料 · 阅读与生活", "80", "启用", "编辑分类"]]}, "/wordlists": {"title": "词库管理", "description": "编辑完整词条快照，试跑并核对后发布；历史命中依据保持原版本。", "tableData": [["危机", "有生效版本"], ["普通违规", "有生效版本"], ["涉校", "有生效版本"], ["学校", "启用", "查看\n编辑\n删除"], ["学院", "启用", "查看\n编辑\n删除"], ["宿管", "启用", "查看\n编辑\n删除"], ["教务处", "启用", "查看\n编辑\n删除"], ["校园", "启用", "查看\n编辑\n删除"], ["校方", "启用", "查看\n编辑\n删除"], ["校领导", "启用", "查看\n编辑\n删除"], ["辅导员", "启用", "查看\n编辑\n删除"]]}}</script>
<body><aside class="sidebar"><div class="brand"><div class="mark">鲤</div><div>鲤愿池<small>管理端</small></div></div><div id="menu" class="menu"></div><footer>鲤愿池 · WEB 管理端</footer></aside><header class="topbar"><div id="breadcrumb"></div><div class="tools"><div class="themes"><b>浅色</b><b>深色</b><b>跟随系统</b></div><span>admin</span><button>退出登录</button></div></header><main class="main"></main><footer class="page-footer">粤ICP备2025460136号-1</footer>
<script>
const params=new URLSearchParams(location.search),family=params.get('family')||'simple';if(params.get('theme')==='dark')document.documentElement.classList.add('dark');
const snapshots=JSON.parse(document.querySelector('#same-data').textContent);const path={simple:'/resource-categories',resources:'/resources',words:'/wordlists'}[family];const snapshot=snapshots[path];const fallback={simple:{title:'资料分类',description:'维护分类名称、排序与启用状态；排序数字越小越靠前。',tableData:[['样板资料 · 阅读与生活','80','启用','编辑分类']]},resources:{title:'资料管理',description:'管理分类、简介、文件与下载链接；草稿保存后仍需显式上架。',tableData:[]},words:{title:'词库管理',description:'编辑完整词条快照，试跑并核对后发布；历史命中依据保持原版本。',tableData:[['危机','有生效版本'],['普通违规','有生效版本'],['涉校','有生效版本'],['学校','启用','查看 编辑 删除'],['学院','启用','查看 编辑 删除'],['宿管','启用','查看 编辑 删除'],['教务处','启用','查看 编辑 删除'],['校园','启用','查看 编辑 删除'],['校方','启用','查看 编辑 删除'],['校领导','启用','查看 编辑 删除'],['辅导员','启用','查看 编辑 删除']]}}[family];const data=snapshot||fallback;const e=x=>String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
const titleAction=family==='simple'?'新建分类':family==='resources'?'新建资料':'新建完整草稿';const group=family==='words'?'内容治理':'资料管理';document.querySelector('#breadcrumb').textContent='首页　/　'+group+'　/　'+data.title;document.querySelector('#menu').innerHTML=['首页','用户管理','包分配','资料管理',...(family!=='words'?['资料列表','资料分类']:[]),'内容管理','内容治理',...(family==='words'?['内容审核','树洞审核','词库管理']:[]),'安全治理','隐私管理','系统管理'].map(t=>`<span class="${t===data.title||t==='资料列表'&&family==='resources'?'active ':''}${['资料列表','资料分类','内容审核','树洞审核','词库管理'].includes(t)?'sub':['首页'].includes(t)?'':'group'}">${t}</span>`).join('');
const heading=`<div class="heading"><div class="copy"><h1>${e(data.title)}</h1><p>${e(data.description)}</p></div><button class="primary">${titleAction}</button></div>`;const pagination=`<div class="pagination"><label>每页数量<select><option>10</option></select></label><button disabled>上一页</button><button disabled>下一页</button></div>`;
let body='';if(family!=='words'){const columns=family==='simple'?['分类名称','排序','状态','操作']:['标题 / 简介','分类 / 状态','当前版本反馈','更新时间','操作'];const filters=family==='simple'?'<label>启用状态<select><option>全部</option></select></label>':'<label>关键词<input placeholder="搜索标题或简介"></label><label>分类<select><option>全部分类</option></select></label><label>状态<select><option>全部状态</option></select></label>';const rows=data.tableData.map(row=>'<tr>'+row.map((v,i)=>{let html=e(v);if(i===row.length-1)html='<button>'+html+'</button>';else if(family==='resources'&&i===0){const a=v.split('\n');html=e(a.shift())+'<p>'+e(a.join('\n'))+'</p>'}else if(family==='resources'&&i===2)html=(v.match(/[^0-9]+[0-9]+/g)||[v]).map(x=>'<span class="feedback">'+e(x)+'</span>').join('');return '<td>'+html+'</td>'}).join('')+'</tr>').join('');body=`<section class="panel"><div class="filters">${filters}<button>查询 / 从首页刷新</button></div><div class="table-scroll"><table><thead><tr>${columns.map(t=>'<th>'+t+'</th>').join('')}</tr></thead><tbody>${rows}</tbody></table></div>${pagination}</section>`}else{const kinds=data.tableData.slice(0,3),entries=data.tableData.slice(3);body=`<div class="columns"><section class="panel padded"><h2>选择词库</h2><div class="kind-table"><table><thead><tr><th>词库</th><th>生效状态</th></tr></thead><tbody>${kinds.map(r=>`<tr class="${r[0]==='涉校'?'active':''}"><td>${e(r[0])}</td><td>${e(r[1])}</td></tr>`).join('')}</tbody></table></div></section><section class="panel padded"><h2>涉校词库详情</h2><p class="record">已发布 · 资源版本 2</p><label class="word-search">搜索词条<input placeholder="输入词条关键词"></label><div class="word-toolbar"><button class="primary">新增词条</button><button>批量导入</button><button class="spacer">刷新词库</button><button>版本记录</button></div><div class="word-table"><table><caption>词条明细</caption><thead><tr><th>词条</th><th>状态</th><th>操作</th></tr></thead><tbody>${entries.map(r=>`<tr><td>${e(r[0])}</td><td><span class="switch"><i></i>${e(r[1])}</span></td><td><div class="actions"><button>查看</button><button>编辑</button><button>删除</button></div></td></tr>`).join('')}</tbody></table></div><div class="pagination word-pagination"><label>每页数量<select><option>10</option></select></label><button disabled>上一页</button><span>第 1 / 1 页</span><button disabled>下一页</button></div></section></div>`}document.querySelector('main').innerHTML=(family==='words'?'<nav class="word-navigation"><span>内置词库</span><span class="active">自定义词库</span><span>发布记录</span></nav>':'')+heading+body;
if(params.get('state')==='drawer'&&family==='simple')document.body.insertAdjacentHTML('beforeend','<div class="drawer-backdrop"></div><section class="drawer"><header><h2>新建分类</h2><p>单级分类；改名会同步影响引用资料。</p></header><div class="drawer-body"><label>分类名称（1–30字）<input></label><label>排序（0–9999）<input type="number" value="0"></label><p>新分类默认启用。</p><p>改名同步影响引用资料的显示。任意草稿、上架或下架资料仍引用时，不能停用分类。</p></div><footer><button>取消</button><button class="primary">确认保存</button></footer></section>');
</script></body></html>

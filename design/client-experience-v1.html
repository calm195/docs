    .mini{--bg:#fcfaf7;--surface:#ffffff;--ink:#091d3d;--muted:#617184;--line:#e9e9e7;--brand:#ff4c3e;--on-brand:#fff;--rose:#a35b64;--letter:#f8efe9;--letter-ink:#493633;--on-rose:#fff;width:375px;margin:auto;background:var(--bg);color:var(--ink);min-height:768px;padding:16px;font-size:14px;line-height:1.6}.mini.dark{--bg:#0f172a;--surface:#1e293b;--ink:#e2e8f0;--muted:#b6c2d2;--line:#526176;--brand:#ff9288;--on-brand:#091d3d;--rose:#e4a6b1;--letter:#34282d;--letter-ink:#f4dbe0;--on-rose:#38242b}.mini .eyebrow{font-size:12px;letter-spacing:2px;color:var(--rose);display:block;margin-bottom:6px}.mini h1{font-size:22px;line-height:1.35;margin-bottom:8px}.mini h2{font-size:16px;line-height:1.5}.mini h3{font-size:14px}.mini .muted{color:var(--muted);font-size:12px}.mini .letter-head{padding:24px 20px;background:var(--letter);border-radius:16px;color:var(--letter-ink);position:relative;overflow:hidden;margin-bottom:12px}.mini .letter-head:after{content:"";width:72px;height:48px;border:1px solid var(--rose);position:absolute;right:-12px;top:-10px;transform:rotate(-20deg);opacity:.18;border-radius:5px}.mini .letter-head p{font-size:12px;line-height:1.6}.mini .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.mini .step{padding:10px 0;border-radius:10px;text-align:center;background:transparent;color:var(--muted);font-size:12px}.mini .step b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--line);margin-right:4px;font-size:11px}.mini .step.active{color:var(--rose);background:var(--letter)}.mini .step.active b{background:var(--rose);color:var(--bg)}.mini .card{padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:12px}.mini .section-intro{margin-bottom:16px}.mini .section-intro p{margin-top:4px}.mini .fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.mini .fields.range{grid-template-columns:repeat(2,minmax(0,1fr))}.mini .field{display:block;margin-bottom:16px;font-size:12px;color:var(--muted)}.mini .field input,.mini .field textarea{display:block;width:100%;margin-top:6px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;color:var(--ink);font-size:14px;min-height:44px}.mini .field textarea{resize:vertical;min-height:88px}.mini .field-counter{display:block;text-align:right;margin-top:4px;font-size:12px;color:var(--muted)}.mini .section-label{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px}.mini .chip-row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.mini .chip{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:6px 12px;color:var(--ink);font-size:12px}.mini .chip.selected{background:var(--letter);color:var(--rose);border-color:var(--rose)}.mini .chip.pending{border-style:dashed}.mini .segmented{display:flex;gap:16px;border-bottom:1px solid var(--line);font-size:12px;overflow:auto}.mini .segmented span{padding:10px 0;white-space:nowrap}.mini .segmented .active{color:var(--rose);border-bottom:2px solid var(--rose)}.mini .actions{display:flex;gap:12px;margin-top:16px}.mini .button{border-radius:12px;min-height:44px;padding:10px 18px;background:var(--letter);color:var(--rose);font-weight:600;flex:1}.mini .button.primary{background:var(--rose);color:var(--on-rose)}.mini .button.red{background:var(--brand);color:var(--on-brand)}.mini .text-action{padding:6px 0;color:var(--rose);background:transparent;font-size:12px}.mini .row{display:flex;justify-content:space-between;align-items:center;gap:12px}.mini .avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--letter);color:var(--rose);font-size:18px;flex:none}.mini .person{display:flex;align-items:center;gap:12px}.mini .badge{display:inline-block;background:var(--letter);color:var(--rose);font-size:11px;padding:3px 8px;border-radius:6px}.mini .quote{padding:14px 0;margin-top:12px;border-top:1px solid var(--line);font-size:14px}.mini .timeline{margin-top:12px;padding:12px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;font-size:12px}.mini .timeline span{display:block;color:var(--muted)}.mini .task{padding:14px 0;border-top:1px solid var(--line);display:flex;gap:12px;align-items:center}.mini .day{width:36px;color:var(--rose);font-size:12px;flex:none}.mini .task-copy{flex:1}.mini .task-copy p{margin-top:2px}.mini .article{font-size:14px;line-height:1.8;margin-top:16px}.mini .article h1{margin:16px 0}.mini .stats{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.mini .comment{padding:16px 0;border-top:1px solid var(--line)}.mini .comment:first-of-type{margin-top:12px}.mini .comment p{margin-top:8px}.mini .reply{margin-top:10px;background:var(--bg);padding:12px;border-radius:8px;font-size:12px}.mini .summary-row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}.mini .summary-row:last-child{border:0}.mini .summary-row span:first-child{color:var(--muted)}
    .admin{--bg:#f5f7fa;--surface:#fff;--ink:#1d2939;--muted:#667085;--line:#e4e7ec;--accent:#254e70;--soft:#edf3f8;display:grid;grid-template-columns:208px minmax(0,1fr);background:var(--bg);color:var(--ink);min-height:900px;min-width:1024px;position:relative}.admin.dark{--bg:#151c25;--surface:#202b38;--ink:#edf1f7;--muted:#b0bdcc;--line:#3d4b5d;--accent:#a5cbe8;--soft:#2b4156}.admin .sidebar{background:var(--surface);border-right:1px solid var(--line);padding:24px 16px}.admin .brand{display:flex;align-items:center;gap:10px;font-size:18px;margin-bottom:32px}.admin .brand b{width:32px;height:32px;border-radius:10px;background:var(--accent);color:var(--surface);display:grid;place-items:center;font-size:18px}.admin .nav-label{font-size:12px;color:var(--muted);margin:22px 12px 10px}.admin .nav-item{padding:10px 14px;margin:3px 0;border-radius:8px}.admin .nav-item.active{background:var(--soft);color:var(--accent);font-weight:600}.admin .topbar{height:64px;padding:0 32px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}.admin .main{padding:32px;max-width:1440px;margin:auto}.admin .heading{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:24px}.admin h1{font-size:26px;line-height:36px;letter-spacing:-.4px}.admin h2{font-size:18px;line-height:28px}.admin h3{font-size:14px}.admin .heading p{color:var(--muted);font-size:13px;margin-top:6px}.admin .button{padding:8px 16px;line-height:22px;border:1px solid var(--line);border-radius:8px;min-height:40px;background:var(--surface);color:var(--ink);white-space:nowrap}.admin .button.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}.admin .button.danger{color:#b42318}.admin .panel{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;margin-bottom:24px}.admin .filters{display:flex;align-items:end;gap:16px;padding:24px;flex-wrap:wrap}.admin .advanced-filters{flex-basis:100%;font-size:13px;color:var(--muted)}.admin .advanced-filters>.filters{padding:16px 0 0}.admin .list-summary h3{font-size:16px;line-height:24px}.admin .list-summary p{margin-top:6px;font-size:13px;line-height:20.8px}.admin .filter{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:13px;min-width:140px}.admin .filter input,.admin .filter select{min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:260px}.admin .filter.grow{flex:1}.admin .filter.grow input{max-width:none}.admin .table-scroll{overflow-x:auto}.admin .activity-table{min-width:960px;table-layout:fixed}.admin table{width:100%;border-collapse:collapse;text-align:left}.admin th{padding:14px 24px;font-size:12px;font-weight:500;color:var(--muted);background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.admin td{height:64px;line-height:20px;padding:12px 24px;border-bottom:1px solid var(--line);font-size:14px}.admin td small{display:block;color:var(--muted);font-size:12px;line-height:18px}.admin .link{border:0;background:none;color:var(--accent);padding:4px 0;font-weight:500}.admin .status{display:inline-block;border-radius:6px;padding:3px 8px;font-size:12px;background:var(--soft);color:var(--accent);white-space:nowrap}.admin .status.warm{background:#fff4db;color:#8f5c11}.admin .status.success{background:#eaf4ee;color:#24744a}.admin .pagination{padding:18px 24px;display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.admin .pagination div{display:flex;align-items:center;gap:12px}.admin .back{color:var(--muted);padding:0 0 16px;background:none}.admin .tabs{padding:0 24px;display:flex;gap:28px;border-bottom:1px solid var(--line);overflow:auto}.admin .tab{padding:18px 0;background:none;color:var(--muted);white-space:nowrap}.admin .tab.active{color:var(--accent);border-bottom:2px solid var(--accent)}.admin .pad{padding:24px}.admin .two-columns{display:grid;grid-template-columns:1fr 1fr;gap:24px}.admin .info-grid{display:grid;grid-template-columns:110px minmax(0,1fr);gap:20px 24px;margin:24px 0}.admin .info-grid dt{color:var(--muted)}.admin .info-grid dd{margin:0}.admin .note{font-size:13px;color:var(--muted);line-height:1.7}.admin .drawer-shade{position:absolute;inset:0;background:#14233755;display:flex;justify-content:flex-end;z-index:2}.admin .drawer{width:min(680px,100%);height:900px;background:var(--surface);display:flex;flex-direction:column;box-shadow:-8px 0 30px #00000010}.admin .drawer-head{padding:24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.admin .drawer-body{padding:24px;overflow:auto;flex:1}.admin .drawer-foot{padding:20px 24px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;gap:12px}.admin .close{background:transparent;color:var(--muted);font-size:22px;width:32px;height:32px}.admin .metric-row{display:flex;padding:0 0 24px;border-bottom:1px solid var(--line);margin-bottom:24px}.admin .metric{flex:1}.admin .metric small{display:block;color:var(--muted);font-size:12px}.admin .metric strong{font-size:22px;font-weight:600;display:block;margin-top:4px}.admin .article{padding-bottom:24px;border-bottom:1px solid var(--line);margin-bottom:24px}.admin .article h2{margin-bottom:12px}.admin .article p{line-height:1.9}.admin .comment{padding:16px 0;border-bottom:1px solid var(--line)}.admin .comment p{margin-top:8px}.admin .reply{margin-top:12px;padding:12px 16px;background:var(--bg);border-radius:8px;font-size:13px}.admin textarea{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:90px;margin-top:8px;resize:vertical}.admin .tag{display:inline-block;margin:4px;padding:4px 10px;background:var(--soft);border-radius:8px;color:var(--accent)}

<body>
  <header class="reference-controls">
    <strong>鲤愿池 · 新版设计参考</strong>
    <label>样板<select id="sample"><option value="profile">小程序 · 三步资料</option><option value="paired">小程序 · 配对结果</option><option value="wish">小程序 · 心愿详情</option><option value="activities">管理端 · 活动列表与详情</option><option value="traits">管理端 · 特质管理</option><option value="content">管理端 · 内容详情</option></select></label>
    <label>状态<select id="state"></select></label>
    <label>主题<select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label>
    <span class="reference-note">设计参考 · 合成内容</span>
  </header>
  <main class="reference-stage" id="stage"></main>
  <script>
    const sample=document.getElementById('sample');const state=document.getElementById('state');const theme=document.getElementById('theme');const stage=document.getElementById('stage');
    const states={profile:[['about','关于我'],['expect','我的期待'],['confirm','确认资料']],paired:[['not_enrolled','未报名'],['pending_review','待审核'],['paired','已配对'],['waiting','等待公布'],['unmatched','未配对'],['ended','已结束']],wish:[['detail','详情与评论'],['error','评论加载失败']],activities:[['list','列表'],['detail','独立详情']],traits:[['list','列表'],['review','审核抽屉'],['create','新增词条']],content:[['detail','公开详情与评论'],['review','审核内容']]};
    function miniHead(label,title,copy){return `<header class="letter-head"><span class="eyebrow">${label}</span><h1>${title}</h1><p>${copy}</p></header>`}
    function field(label,value,type='text'){return `<label class="field">${label}<input type="${type}" value="${value}"></label>`}
    function profile(){const n=state.value==='about'?0:state.value==='expect'?1:2;return miniHead('给未来的相遇','先从认识你开始','认真写下自己，也留一点空间给惊喜。')+`<nav class="steps">${['关于我','我的期待','确认资料'].map((x,i)=>`<button class="step ${i===n?'active':''}" data-state="${['about','expect','confirm'][i]}"><b>${i+1}</b>${x}</button>`).join('')}</nav>`+(n===0?`<section class="card"><div class="section-intro"><h2>关于我</h2><p class="muted">让对方从这些小事开始认识你。</p></div><div class="row" style="padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--line)"><div><h3>许同学 <span class="badge">已认证</span></h3><p class="muted">五山校区 · 本科生 · INFJ</p></div><button class="text-action">编辑基础资料</button></div><div class="fields">${field('年龄（岁）','22','number')}${field('身高（cm）','168','number')}${field('体重（斤）','110','number')}</div><div class="section-label"><h3>个人特质</h3><span class="muted">2 / 10</span></div><div class="segmented"><span class="active">性格</span><span>兴趣</span><span>生活</span><span>待分类</span></div><div class="chip-row"><button class="chip selected">真诚 ×</button><button class="chip">＋ 添加特质</button></div><p class="muted">新词保存后审核，通过后才会向对方展示。每个1～20字。</p><label class="field" style="margin-top:20px">自我介绍<textarea>喜欢摄影和散步，想遇见一个愿意分享日常的人。</textarea><small class="field-counter">${Array.from('喜欢摄影和散步，想遇见一个愿意分享日常的人。').length} / 500</small></label>${field('微信号（选填）','')}<p class="muted">只向有效配对对象展示，其他同学不可见。</p></section>`:n===1?`<section class="card"><div class="section-intro"><h2>我的期待</h2><p class="muted">选择重要的偏好，也给相遇一些可能。</p></div><div class="fields range">${field('年龄下限','20','number')}${field('年龄上限','25','number')}</div><div class="fields range">${field('身高下限（cm）','160','number')}${field('身高上限（cm）','190','number')}</div><div class="fields range">${field('体重下限（斤）','90','number')}${field('体重上限（斤）','160','number')}</div><h3>期望校区</h3><div class="chip-row"><button class="chip selected">不限校区</button><button class="chip">五山校区</button><button class="chip">大学城校区</button><button class="chip">国际校区</button></div><h3>期望 MBTI</h3><div class="chip-row"><button class="chip selected">不限</button>${['INTJ','INTP','ENTJ','ENTP','INFJ','INFP','ENFJ','ENFP','ISTJ','ISFJ','ESTJ','ESFJ','ISTP','ISFP','ESTP','ESFP'].map(x=>`<button class="chip">${x}</button>`).join('')}</div><div class="section-label"><h3>理想型特质</h3><span class="muted">1 / 10</span></div><div class="segmented"><span class="active">性格</span><span>兴趣</span><span>生活</span><span>待分类</span></div><div class="chip-row"><button class="chip selected">真诚 ×</button><button class="chip">＋ 添加特质</button></div><p class="muted">新词保存后审核，通过后才会向对方展示。每个1～20字。</p></section>`:`<section class="card"><div class="section-intro"><h2>确认资料</h2><p class="muted">这些内容将随你的报名保存。</p></div>${[['年龄','22 岁 · 期待 20–25 岁'],['身高','168 cm · 期待 160–190 cm'],['体重','110 斤 · 期待 90–160 斤'],['期望校区','不限校区'],['期望 MBTI','不限'],['个人特质','真诚 · 摄影'],['理想型特质','真诚'],['自我介绍','喜欢摄影和散步，想遇见一个愿意分享日常的人。'],['微信号','未填写']].map(x=>`<div class="summary-row"><span>${x[0]}</span><span>${x[1]}</span></div>`).join('')}<p class="muted" style="margin-top:16px">资料只向有效配对对象展示。保存不会自动报名，待审词条在通过后对外展示。</p></section>`)+`<div class="actions">${n?`<button class="button" data-state="${n===1?'about':'expect'}">上一步</button>`:''}<button class="button primary" ${n<2?`data-state="${n===0?'expect':'confirm'}"`:''}>${n===2?'保存资料':'下一步'}</button></div><p class="muted" style="text-align:center;margin-top:12px">资料草稿已保存</p>`}
    function paired(){
      const key=state.value;
      const copy={not_enrolled:['把期待，交给这次相遇','完善资料，认真写下你的期待，再确认报名。'],pending_review:['你的来信，我们收到了','资料正在审核，请留意状态更新。你可以在下方查看本次报名。'],paired:['这封来信，有了回音','慢慢认识彼此，从一句问候开始。'],waiting:['把期待，留给相遇','你已报名成功，结果公布后会在这里告诉你。'],unmatched:['这次，把缘分留给下一次','本次结果已公布，暂时没有合适的配对。'],ended:['谢谢你，认真参与这次相遇','活动已结束，愿这段经历留下温柔的回忆。']}[key];
      let html=miniHead('秋日来信 · 七日同行',copy[0],copy[1]);
      if(key==='paired')html+=`<section class="card peer-reference"><div class="person"><div class="avatar">林</div><div><h2>林同学</h2><p class="muted">22 岁 · 168 cm · 110 斤 · INFJ</p></div><span class="badge" style="margin-left:auto">已配对</span></div><p class="muted" style="margin-top:12px">五山 · 大三</p><div class="chip-row"><span class="chip">真诚</span><span class="chip">摄影</span></div><div class="chip-row"><span class="muted">理想型特质</span><span class="chip">真诚</span><span class="chip">散步</span></div><p class="quote">喜欢摄影和散步，想遇见一个愿意分享日常的人。</p><p class="peer-wechat">微信号：synthetic_design</p><p class="muted" style="margin:16px 0 12px">推荐分 86.5 · 按当前规则评分，不表示匹配概率</p><button class="button primary" style="width:100%">和 TA 聊聊</button><div class="timeline"><div>相遇开始<span>2026-11-16 09:00:00</span></div><div>相伴 7 天<span>2026-11-23 09:00:00 结束</span></div></div><p class="muted">请尊重彼此，不向他人转发对方的个人资料。</p></section><section class="card"><div class="row"><h2>每天，靠近一点</h2><span class="muted">第 1 天</span></div><div class="task"><div class="day">DAY<br><strong>01</strong></div><div class="task-copy"><h3>分享一件今天的小事</h3><p class="muted">还未查看 · 点开后阅读任务内容</p></div><button class="text-action">查看</button></div><button class="text-action">查看全部 7 天</button><p class="muted">任务记录表示是否查看，不代表已经完成。</p></section>`;
      if(['waiting','unmatched','ended'].includes(key))html+=`<section class="card"><h2>${key==='waiting'?'安心等待，好好生活':key==='unmatched'?'下一次，继续期待':'这段旅程已结束'}</h2><p class="muted" style="margin-top:8px">${key==='waiting'?'公布时间仅供参考，以实际发布结果为准。':key==='unmatched'?'可以更新你的资料，或看看下一场活动。':'已结束的配对不再展示对方资料、聊天入口与任务。'}</p>${key==='waiting'?'<div class="summary-row"><span>最早公布时间</span><span>2026-11-16 09:00:00</span></div>':`<div class="actions"><button class="button primary">${key==='unmatched'?'完善资料':'查看其他活动'}</button></div>${key==='unmatched'?'<button class="text-action">查看其他活动 ›</button>':''}`}</section>`;
      if(key!=='not_enrolled')html+=`<section class="card"><div class="row"><h2>我的报名</h2><span class="badge">${key==='pending_review'?'待审核':'报名审核已通过'}</span></div><details style="margin-top:16px"><summary>报名资料 · 查看快照</summary><p class="muted" style="margin-top:12px">当前报名保存的基础资料、偏好和特质；更改个人资料后需按活动规则更新报名。</p></details><p class="muted" style="margin-top:16px">${key==='pending_review'?'请留意审核结果，按需要更新报名资料。':'报名截止、已有配对或当前资格受限时，不能修改报名资料。'}</p></section>`;

    function wish(){return `<section class="card"><div class="row"><div class="person"><div class="avatar">许</div><div><h3>许同学</h3><p class="muted">ID LY-DEMO-REFERENCE</p></div></div><span class="badge">已上架</span></div><article class="article"><h1>想找一位一起去图书馆的搭子</h1><p>最近在准备期末复习，想找一位同学一起去图书馆。可以安静学习，休息时聊聊今天的小收获。</p><p style="margin-top:12px">时间是周末下午，不限专业，认真赴约就好。</p></article><p class="muted" style="margin-top:12px">求助 · 五山 · 报答：一句真诚感谢</p><p class="muted" style="margin-top:16px">11月16日发布 · 11月23日截止</p><div class="stats"><span>支持 12</span><span>应愿 3</span><span>评论 2</span><span>浏览 128</span></div><div class="actions"><button class="button">收藏</button><button class="button red">我想应愿</button></div><div class="row" style="margin-top:10px"><button class="text-action">分享心愿</button><button class="text-action">更多操作</button></div></section><section class="card"><div class="row"><h2>聊聊这个心愿</h2><button class="text-action">写评论</button></div>${state.value==='error'?'<div class="comment"><p>评论暂时未能加载</p><button class="text-action">重新加载评论</button></div>':`<div class="comment"><div class="row"><h3>陈同学</h3><span class="muted">11月16日</span></div><p>我也在准备期末，周六下午可以一起。</p><button class="text-action">回复</button><div class="reply"><strong>许同学 · 帖主</strong><p>回复 陈同学：好呀，到时一起去。</p></div></div><div class="comment"><span class="badge">作者补充</span><p>暂定下午两点在图书馆门口见。</p></div><button class="text-action">查看全部评论</button>`}</section>`}
    function adminShell(content){const current=sample.value==='activities'?'活动管理':sample.value==='traits'?'特质标签':'心愿内容';return `<aside class="sidebar"><div class="brand"><b>鲤</b><strong>鲤愿池</strong></div><div class="nav-item">工作台</div><div class="nav-label">用户管理</div><div class="nav-item">用户资料</div><div class="nav-item">学生认证</div><div class="nav-label">包分配</div>${['活动管理','特质标签','每日任务库'].map(x=>`<div class="nav-item ${current===x?'active':''}">${x}</div>`).join('')}<div class="nav-label">内容管理</div>${['心愿内容','悄悄话','内容审核'].map(x=>`<div class="nav-item ${current===x?'active':''}">${x}</div>`).join('')}<div class="nav-label">更多工作</div><div class="nav-item">资料与分类</div><div class="nav-item">安全与隐私</div><div class="nav-item">系统设置</div></aside><div><header class="topbar"><span>工作台 / ${current}</span><span>管理账号　 ·　 浅色 / 深色</span></header><div class="main">${content}</div></div>`}
    function heading(title,copy,action){return `<header class="heading"><div><h1>${title}</h1><p>${copy}</p></div>${action?`<button class="button primary" ${action==='新增词条'?'data-state="create"':''}>＋ ${action}</button>`:''}</header>`}
    function filter(label,values){return `<label class="filter">${label}<select>${values.map(x=>`<option>${x}</option>`).join('')}</select></label>`}
    function pager(count){return `<footer class="pagination"><span>共 ${count} 条记录</span><div><button class="button" disabled>上一页</button><span>1 / 1</span><button class="button" disabled>下一页</button></div></footer>`}
    function activities(){if(state.value==='detail')return `<button class="back" data-state="list">← 返回活动列表</button>`+heading('秋日来信 · 七日同行','管理报名、配对与每日任务，跟进每一场相遇。','')+`<section class="panel"><div class="tabs"><button class="tab active">活动设置</button><button class="tab">报名审核</button><button class="tab">配对结果</button><button class="tab">每日任务</button></div><div class="pad"><div class="row"><h2>活动信息</h2><span class="status success">进行中</span></div><dl class="info-grid"><dt>活动名称</dt><dd>秋日来信 · 七日同行</dd><dt>报名截止</dt><dd>2026-11-15 20:00</dd><dt>活动时间</dt><dd>2026-11-16 09:00 — 2026-11-23 09:00</dd><dt>活动天数</dt><dd>7 天</dd><dt>活动说明</dt><dd>认真分享日常，慢慢认识一个人。</dd></dl><p class="note">配对方案经核对、应用到草稿后，仍需单独发布结果。</p></div></section>`;return heading('活动管理','安排每一次相遇，清楚掌握报名与活动进展。','新建活动')+`<section class="panel"><div class="filters"><div class="list-summary" style="flex:1"><h3>全部活动</h3><p class="note">按当前页展示，进入详情管理活动。</p></div><span class="note">每页 20 条</span><button class="button">刷新列表</button></div><div class="table-scroll"><table class="activity-table"><colgroup><col style="width:32%"><col style="width:12%"><col style="width:18%"><col style="width:26%"><col style="width:12%"></colgroup><thead><tr><th>活动</th><th>阶段</th><th>报名截止</th><th>活动时间</th><th>操作</th></tr></thead><tbody><tr><td>秋日来信 · 七日同行<small>7 天 · 每日任务</small></td><td><span class="status success">进行中</span></td><td>11月15日 20:00</td><td>11月16日 — 11月23日</td><td><button class="link" data-state="detail">管理活动 →</button></td></tr><tr><td>下一封来信<small>7 天 · 每日任务</small></td><td><span class="status warm">报名中</span></td><td>11月22日 20:00</td><td>11月23日 — 11月30日</td><td><button class="link" data-state="detail">管理活动 →</button></td></tr></tbody></table></div>${pager(2)}</section>`}
    function traits(){let html=heading('特质标签','按分类整理表达，审核新词并管理可选范围。','新增词条')+`<section class="panel"><div class="filters"><label class="filter grow">词条名称<input placeholder="搜索特质"></label>${filter('用途',['全部用途','个人特质','理想型'])}${filter('分类',['全部分类','性格','兴趣','生活','待分类'])}${filter('审核状态',['已通过','待审核','已驳回'])}<button class="button primary">查询</button><details class="advanced-filters"><summary>更多筛选</summary><div class="filters">${filter('是否可选',['全部','已启用','已停用'])}${filter('选用者性别',['全部性别','男生','女生','未设置'])}<label class="filter">最低热度<input type="number" min="0" placeholder="不限"></label><label class="filter">最高热度<input type="number" min="0" placeholder="不限"></label>${filter('热度排序',['从高到低','从低到高'])}</div></details></div><table><thead><tr><th>词条</th><th>分类</th><th>审核</th><th>选用状态</th><th>使用人数</th><th>操作</th></tr></thead><tbody>${[['真诚','性格','已通过','可选用','24'],['摄影','兴趣','已通过','可选用','18'],['散步','生活','待审核','待审核','1']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td><span class="status ${x[2]==='待审核'?'warm':''}">${x[2]}</span></td><td>${x[3]}</td><td>${x[4]}</td><td><button class="link" data-state="review">${x[2]==='待审核'?'查看与审核':'查看详情'}</button></td></tr>`).join('')}</tbody></table>${pager(3)}</section><section class="panel pad"><div class="row" style="display:flex;justify-content:space-between;align-items:center;gap:16px"><h2>大家如何描述自己</h2><div><button class="button">标签列表</button><button class="button">热度词云</button></div></div><p class="note" style="margin-top:20px">展示当前筛选前100个词条，字号表示真实使用人数。</p><div style="padding-top:16px"><span class="tag" style="font-size:22px">真诚</span><span class="tag" style="font-size:18px">摄影</span><span class="tag">散步</span></div></section>`;if(state.value==='review')html+=drawer('审核词条',`<h2>散步 <span class="status warm">待审核</span></h2><dl class="info-grid"><dt>用途</dt><dd>个人特质</dd><dt>当前分类</dt><dd>生活</dd><dt>使用人数</dt><dd>1 人 · 男生0 / 女生1 / 未披露0</dd><dt>创建时间</dt><dd>2026-11-16 10:00</dd><dt>选用状态</dt><dd>审核通过后可选用</dd></dl><h3>词库命中依据</h3><p class="note" style="margin:12px 0 24px">展示服务端返回的审核依据，审核结论独立于启停。</p><label>处理理由<textarea placeholder="填写审核或归类理由"></textarea></label>`,`<button class="button" data-state="list">关闭</button><button class="button danger">驳回</button><button class="button primary">通过审核</button>`);if(state.value==='create')html+=drawer('新增词条',`<label class="filter">词条名称<input placeholder="1～20字"></label><div style="margin-top:24px">${filter('分类',['性格','兴趣','生活','待分类'])}</div><label class="filter" style="margin-top:24px">新增理由<textarea placeholder="说明新增用途"></textarea></label><p class="note" style="margin-top:16px">已有同名词条请使用既有记录，新增不能覆盖共享词条分类。</p>`,`<button class="button" data-state="list">取消</button><button class="button primary">保存词条</button>`);return html}
    function drawer(title,body,foot){return `<div class="drawer-shade"><section class="drawer" role="dialog" aria-label="${title}"><header class="drawer-head"><h2>${title}</h2><button class="close" data-state="${sample.value==='content'?'detail':'list'}" aria-label="关闭">×</button></header><div class="drawer-body">${body}</div><footer class="drawer-foot">${foot}</footer></section></div>`}
    function content(){if(state.value==='review')return heading('内容审核','核对当前版本的正文与审核依据，再作出处理。','')+`<section class="panel pad"><h2>待审核内容</h2><p class="note">心愿 · 待人工审核</p></section>`+drawer('内容审核',`<div class="status warm">待人工审核</div><dl class="info-grid"><dt>内容类型</dt><dd>心愿</dd><dt>内容版本</dt><dd>1</dd><dt>案件版本</dt><dd>1</dd></dl><article class="article"><h2>想找一位校园阅读搭子</h2><p>希望周末在校园图书馆一起阅读。这是用于开发验证的合成心愿。</p></article><h3>词库命中依据</h3><p class="note" style="margin-top:12px">校园 · 需人工审核</p>`,`<button class="button">关闭</button><button class="button danger">升级危机</button><button class="button primary">处理内容审核</button>`);return heading('心愿内容','查看公开内容与互动上下文，按权限进行处理。','')+`<section class="panel"><div class="filters"><label class="filter grow">内容标题<input value="想找一位一起去图书馆的搭子"></label>${filter('状态',['已发布','全部状态'])}<button class="button primary">查询</button></div><table><thead><tr><th>心愿</th><th>状态</th><th>发布时间</th><th>操作</th></tr></thead><tbody><tr><td>想找一位一起去图书馆的搭子</td><td><span class="status success">已发布</span></td><td>11月16日</td><td><button class="link">查看详情</button></td></tr></tbody></table>${pager(1)}</section>`+drawer(state.value==='review'?'内容审核':'心愿详情',`<div class="metric-row">${[['支持','12'],['应愿','3'],['评论','2'],['浏览','128']].map(x=>`<div class="metric"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div><article class="article"><h2>想找一位一起去图书馆的搭子</h2><p class="note" style="margin-bottom:16px">许同学 · 11月16日发布 · 11月23日截止</p><p>最近在准备期末复习，想找一位同学一起去图书馆。可以安静学习，休息时聊聊今天的小收获。</p><p style="margin-top:12px">时间是周末下午，不限专业，认真赴约就好。</p></article><h3>评论与回复</h3><div class="comment"><strong>陈同学</strong><p>我也在准备期末，周六下午可以一起。</p><div class="reply"><strong>许同学</strong><p>回复 陈同学：好呀，到时一起去。</p></div></div><div class="comment"><span class="status">作者补充</span><p>暂定下午两点在图书馆门口见。</p></div>${state.value==='review'?'<label style="display:block;margin-top:24px">处理理由<textarea placeholder="结合正文与上下文说明处理理由"></textarea></label>':''}`,state.value==='review'?'<button class="button">暂不处理</button><button class="button danger">驳回</button><button class="button primary">通过审核</button>':'<button class="button">关闭详情</button>')}
    function render(){const isMini=['profile','paired','wish'].includes(sample.value);const fn={profile,paired,wish,activities,traits,content}[sample.value];stage.innerHTML=`<div id="reference-canvas" class="${isMini?'mini':'admin'} ${theme.value==='dark'?'dark':''}">${isMini?fn():adminShell(fn())}</div>`;if(isMini){const width=Number(new URLSearchParams(location.search).get('width'))||375;document.getElementById('reference-canvas').style.zoom=String(width/375)}stage.querySelectorAll('[data-state]').forEach(el=>el.addEventListener('click',()=>{state.value=el.dataset.state;render()}))}
    function choose(){state.innerHTML=states[sample.value].map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');render()}
    sample.addEventListener('change',choose);state.addEventListener('change',render);theme.addEventListener('change',render);const query=new URLSearchParams(location.search);if(states[query.get('sample')])sample.value=query.get('sample');choose();if(states[sample.value].some(x=>x[0]===query.get('state')))state.value=query.get('state');if(query.get('theme')==='dark')theme.value='dark';render();
